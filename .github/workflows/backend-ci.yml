name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/TicketingSLA

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend/TicketingSLA

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend/TicketingSLA
